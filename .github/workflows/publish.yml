name: Publish

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "images/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Archive expired items
        run: python3 tools/prune.py --move
      - name: Build dist
        run: python3 tools/build.py --no-urls
      - name: Commit dist and archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # archive/ is committed with a .gitkeep, but add only paths that exist so a missing
          # directory can never fail the step (git add exits 128 on an unmatched pathspec).
          for dir in dist archive content; do
            if [ -e "$dir" ]; then git add -A -- "$dir"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: build dist [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Purge jsDelivr cache
        continue-on-error: true
        run: |
          curl -fsS https://purge.jsdelivr.net/gh/sumitkvijay/computer-ai-feed@main/dist/v1/hi.json
          curl -fsS https://purge.jsdelivr.net/gh/sumitkvijay/computer-ai-feed@main/dist/v1/en.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
