name: PR check

on: pull_request

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python3 -m unittest discover -s tests
      - name: Validate
        run: python3 tools/validate.py
      - name: Build preview
        run: python3 tools/preview.py > preview.md
      - name: Post or update the preview comment
        # Fork PRs get a read-only token; skip them instead of failing.
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body-file preview.md --edit-last \
            || gh pr comment "$PR_NUMBER" --body-file preview.md
